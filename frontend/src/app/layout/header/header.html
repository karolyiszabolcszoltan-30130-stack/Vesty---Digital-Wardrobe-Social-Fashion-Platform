<header class="site-header">

    <div class="header-inner">

        <!-- VESTY logo - kerdeses -->
        <a class="brand" href="/" aria-label="Vesty kezdőlap" (click)="closeMenu()">
            <span class="brand-name">vesty<span>.</span></span>
            <!--
            <span class="brand-subtitle">
                DIGITAL WARDROBE
            </span>
            -->
        </a>

        <nav class="desktop-nav" aria-label="Fő navigáció">

            <a routerLink="/felfedezes">
                Felfedezés
            </a>

            <a routerLink="/gardrob">
                Digitális gardrób
            </a>

            <a routerLink="/kozosseg">
                Közösség
            </a>

            <a routerLink="/rolunk">
                Rólunk
            </a>

            <a routerLink="/kuponvadasz">
                Kuponvadász
            </a>

            <a routerLink="/ruhapiac">
                Ruhapiac
            </a>

            <a routerLink="/esemenyek">
                Események
            </a>

        </nav>


        <!-- ASZTALI CTA -->

        <!-- ASZTALI FIÓK MŰVELETEK -->
        <div class="header-actions">

            <a routerLink="/login" class="header-login">
                Bejelentkezés
            </a>

            <a routerLink="/register" class="header-cta">
                <span>Fiók létrehozása</span>
            </a>

        </div>


        <!--
        <div class="header-actions">

            <a href="#felfedezes" class="header-cta">
                <span>Fedezd fel</span>

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M7 17L17 7M7 7H17V17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>

            </a>

        </div>
        -->

        <!-- MOBIL MENÜ GOMB -->
        <button class="mobile-menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()"
            aria-controls="mobile-navigation" [attr.aria-label]="isMenuOpen() ? 'Menü bezárása' : 'Menü megnyitása'">

            <span class="menu-icon" [class.menu-open]="isMenuOpen()" aria-hidden="true">
                <span></span>
                <span></span>
            </span>

        </button>

    </div>


    <!-- MOBIL NAV -->
    @if (isMenuOpen()) {

    <nav id="mobile-navigation" class="mobile-nav" aria-label="Mobil navigáció">

        <a routerLink="/felfedezes" (click)="closeMenu()">
            <span>01</span>
            Felfedezés
        </a>

        <a routerLink="/gardrob" (click)="closeMenu()">
            <span>02</span>
            Digitális gardrób
        </a>

        <a routerLink="/kozosseg" (click)="closeMenu()">
            <span>03</span>
            Közösség
        </a>

        <a routerLink="/rolunk" (click)="closeMenu()">
            <span>04</span>
            Rólunk
        </a>

        <a routerLink="/kuponvadasz" (click)="closeMenu()">
            <span>05</span>
            Kuponvadász
        </a>

        <a routerLink="/ruhapiac" (click)="closeMenu()">
            <span>06</span>
            Ruhapiac
        </a>

        <a routerLink="/esemenyek" (click)="closeMenu()">
            <span>07</span>
            Események
        </a>


        <a class="mobile-login" routerLink="/login" (click)="closeMenu()">
            Már van fiókod? Bejelentkezés
        </a>

        <a class="mobile-cta" routerLink="/register" (click)="closeMenu()">
            Fiók létrehozása
        </a>


        <!--
        <a class="mobile-cta" href="#felfedezes" (click)="closeMenu()">
            
            Fedezd fel a Vestyt
            <span aria-hidden="true">↗</span>
            
        </a>
        -->
    </nav>

    }

</header>
